<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book House | Landing Page</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .background {
            background-image: url('https://images.unsplash.com/photo-1512820790803-83ca734da794');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            animation: zoomIn 8s infinite alternate;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
        }
        .content {
            position: relative;
            z-index: 1;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            animation: slideInDown 1s;
        }
        .button-container {
            margin-top: 30px;
        }
        .button {
            background: linear-gradient(45deg, #00c851, #007e33);
            color: white;
            border: none;
            padding: 15px 35px;
            margin: 10px;
            font-size: 18px;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 255, 127, 0.3);
            opacity: 0;
            animation: fadeInUp 1s forwards;
        }
        .button:hover {
            background: linear-gradient(45deg, #007e33, #00c851);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 255, 127, 0.5);
        }
        .top-right {
            position: absolute;
            top: 15px; right: 20px;
            display: flex;
            gap: 10px;
        }
        .main-buttons {
            margin-top: 50px;
        }

        /* Keyframe Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes zoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="overlay"></div>
        <div class="content">
            <h1>Welcome To Book House</h1>
            <div class="main-buttons">
                <button class="button" onclick="location.href='aboutus.html'">About Us</button>
                <button class="button" onclick="location.href='index.html'">Home</button>
                <button class="button" onclick="location.href='contactus.html'">Contact Us</button>
            </div>
        </div>
        <div class="top-right">
            <button class="button" onclick="location.href='userlogin.php'">User Login</button>
            <button class="button" onclick="location.href='register.php'">Register</button>
<button class="button" style="background:#555;" onclick="location.href='house.html'">Admin Login</button>        </div>
    </div>
</body>
</html>
